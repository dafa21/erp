<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP Medical Nurhealth</title>
    <link rel="icon" type="image/png" href="/nurr_favicon.png">
    <script>
      // Global fallback to safeguard against any unresolved/cached lucide icon dynamic reference errors
      window.MonitorPlay = window.MonitorPlay || function() { return null; };
    </script>
  </head>
  <body>
    <div id="root">
        <style>
          .initial-loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            background-color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
          }
          .initial-loader-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
          }
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
          .initial-loader-text {
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
          }
          @media (prefers-color-scheme: dark) {
            .initial-loader-container { background-color: #0f172a; }
            .initial-loader-spinner { border-color: #1e293b; border-top-color: #6366f1; }
            .initial-loader-text { color: #94a3b8; }
          }
        </style>
        <div class="initial-loader-container">
          <div class="initial-loader-spinner"></div>
          <div class="initial-loader-text">Memuat Sistem...</div>
        </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
